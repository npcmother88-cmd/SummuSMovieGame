<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poorly Described Movies — Summus</title>
<style>
:root{--bg:#11131a;--card:#1c202b;--card2:#252a38;--text:#f7f1e7;--muted:#b8b4ad;--accent:#d98c3f;--border:#3a4050;--good:#5ea66b;--bad:#b95f5f}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0d0f15,#17131a);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:24px 16px 50px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px}
h1{margin:4px 0 8px;font-size:clamp(28px,7vw,44px)}.eyebrow,.muted{color:var(--muted)}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.score{text-align:right;min-width:90px}.score b{font-size:32px}.rounds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}.round{padding:10px 4px;text-align:center;border:1px solid var(--border);border-radius:12px;background:var(--card)}
.round.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.question{font-size:clamp(20px,5vw,28px);line-height:1.35;margin:20px 0}.answer{background:var(--card2);border:1px solid var(--border);padding:18px;border-radius:12px;margin:16px 0}.answer b{font-size:24px}
.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:1px solid var(--border);border-radius:12px;padding:13px 18px;background:var(--card2);color:var(--text);font:inherit;font-weight:700;cursor:pointer;min-height:48px}
button.primary{background:var(--accent);color:#17100a;border-color:var(--accent)}button.good{background:var(--good);border-color:var(--good)}button.bad{background:var(--bad);border-color:var(--bad)}button:hover{filter:brightness(1.08)}
.hidden{display:none}.progress{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.finish{text-align:center}.finish .big{font-size:38px;font-weight:800}.footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}
@media(max-width:520px){.rounds{grid-template-columns:repeat(2,1fr)}.top{align-items:center}.card{padding:17px}}
</style>
</head>
<body>
<main>
<section class="card">
<div class="top"><div><div class="eyebrow">SUMMUS GUILD GAME NIGHT</div><h1>🎬 Poorly Described Movies</h1><div class="muted">Guess the movie from the terrible description.</div></div><div class="score"><span class="muted">SCORE</span><br><b id="score">0</b></div></div>
</section>
<div class="rounds" id="rounds"></div>
<section class="card" id="play">
<div class="progress"><b id="roundLabel"></b><span id="progress"></span></div>
<div class="muted" id="value" style="margin-top:8px"></div>
<div class="question" id="clue"></div>
<div class="answer hidden" id="answerBox"><div class="muted">ANSWER</div><b id="answer"></b></div>
<div class="actions"><button class="primary" id="reveal">Reveal Answer</button><button class="good hidden" id="correct">✓ Got It</button><button class="bad hidden" id="wrong">✗ Missed It</button></div>
</section>
<section class="card finish hidden" id="finish"><div class="big">🎉 Game Complete!</div><p id="final"></p></section>
<div class="actions"><button id="newGame">🎲 New Random Game</button><button id="restart">Restart This Game</button></div>
<div class="footer">Easy 1 pt • Medium 2 pts • Hard 3 pts • Bonus 5 pts</div>
</main>
<script>
const BANK = {"easy": [["A rich guy invites strangers to his island and is shocked when the wildlife eats them.", "Jurassic Park"], ["A fish commits several felonies to find his kidnapped son.", "Finding Nemo"], ["An old man kidnaps a child using thousands of balloons.", "Up"], ["Two sisters have an argument that causes a national weather emergency.", "Frozen"], ["A teenager fixes his parents' relationship before he is born.", "Back to the Future"], ["A woman falls in love with her captor because he has a fantastic library.", "Beauty and the Beast"], ["A family forgets one child at Christmas. He handles it surprisingly well.", "Home Alone"], ["A small-town sheriff tries unsuccessfully to cancel beach season.", "Jaws"], ["A teenager discovers boarding school is considerably more dangerous than advertised.", "Harry Potter and the Sorcerer's Stone"], ["A billionaire processes childhood trauma by dressing like a bat.", "Batman Begins"], ["A girl follows a stranger down a hole and immediately regrets several decisions.", "Alice in Wonderland"], ["A cowboy becomes jealous when his owner gets a newer toy.", "Toy Story"], ["A lion spends years avoiding his responsibilities before finally going home.", "The Lion King"], ["A woman loses a shoe and accidentally starts a nationwide search.", "Cinderella"], ["A green man wants everyone off his property.", "Shrek"], ["A teenager skips school with enough confidence to make it educational.", "Ferris Bueller's Day Off"], ["A child befriends an undocumented extraterrestrial and hides him from the government.", "E.T. the Extra-Terrestrial"], ["A man gets stranded and becomes emotionally dependent on sporting equipment.", "Cast Away"], ["A woman and a very large ship both make poor decisions involving ice.", "Titanic"], ["A rat secretly runs a restaurant through hair-based management.", "Ratatouille"], ["A family fights over whether a magical house should have better communication skills.", "Encanto"], ["A man spends Christmas defending a building while barefoot.", "Die Hard"], ["A princess runs away and starts living with seven strange men.", "Snow White and the Seven Dwarfs"], ["A young woman attends a dance and leaves before anyone can ask reasonable follow-up questions.", "Cinderella"], ["A group of toys experiences an existential crisis whenever humans enter the room.", "Toy Story"], ["A man discovers his entire life has excellent production values.", "The Truman Show"], ["A family moves into a house whose previous residents refuse to leave.", "Beetlejuice"], ["A girl moves somewhere new and discovers her emotions have formed a committee.", "Inside Out"], ["A young woman leaves home to join the military while pretending to be someone else.", "Mulan"], ["A teenager discovers his new pet has very strong opinions about training.", "How to Train Your Dragon"]], "medium": [["A woman gets a new job and discovers her boss has extremely strong opinions about sweaters.", "The Devil Wears Prada"], ["A group vacation is ruined by someone who really hates Antarctica.", "The Thing"], ["A father buys a pet and receives three simple instructions. Nobody follows them.", "Gremlins"], ["A babysitter discovers the children are not the evening's biggest problem.", "Halloween"], ["A hotel employee develops an unusually aggressive case of writer's block.", "The Shining"], ["Four entrepreneurs start a pest-control company with dangerously experimental equipment.", "Ghostbusters"], ["A woman interviews an incarcerated foodie for career advice.", "The Silence of the Lambs"], ["A group of scientists learns that bringing souvenirs aboard the ship is against policy for a reason.", "Alien"], ["A scientist discovers teleportation and fails to inspect the equipment for insects.", "The Fly"], ["A man wakes up to the same terrible workday until he improves his personality.", "Groundhog Day"], ["A teenager learns karate because moving neighborhoods did not go smoothly.", "The Karate Kid"], ["A group of children spends summer vacation looking for a dead body.", "Stand by Me"], ["A woman has a difficult breakup and decides memory removal is easier than communication.", "Eternal Sunshine of the Spotless Mind"], ["A family road trip continues despite overwhelming evidence that it should not.", "National Lampoon's Vacation"], ["A man goes to great lengths to return a briefcase to a woman he barely knows.", "Dumb and Dumber"], ["A group of friends learns that summer camp stories occasionally deserve investigation.", "Friday the 13th"], ["A man's vacation is interrupted by an unusually persistent law-enforcement officer.", "First Blood"], ["A child sees something his therapist would really prefer were metaphorical.", "The Sixth Sense"], ["A group of teenagers learns that sleep deprivation can sometimes be medically justified.", "A Nightmare on Elm Street"], ["A woman attends dinner and discovers the host takes party games much too seriously.", "Ready or Not"], ["A man takes a job driving a wealthy family and develops serious concerns about the neighborhood.", "Get Out"], ["A family adopts a child whose hobbies raise several reasonable questions.", "The Omen"], ["A cop and an archaeologist have very different approaches to snakes.", "Raiders of the Lost Ark"], ["A teenager discovers that shopping after dark can be hazardous to your health.", "The Lost Boys"], ["A man receives some unusual rules after purchasing a Christmas present.", "Gremlins"], ["A group of teenagers discovers that a video rental can come with an aggressive return policy.", "The Ring"], ["A woman takes a temporary job caring for children in a very large house. The house has opinions.", "The Others"], ["A family vacation gets complicated when Dad takes a wrong turn into organized crime.", "We're the Millers"], ["A man tries to reconnect with his family during a corporate Christmas party.", "Die Hard"], ["A group of high school students spends detention learning that stereotypes are inconvenient.", "The Breakfast Club"]], "hard": [["A photographer becomes far too invested in neighborhood gossip.", "Rear Window"], ["A group of travelers learns that asking strangers for directions can have consequences.", "The Texas Chain Saw Massacre"], ["A scientist ignores several reasonable concerns about his transportation experiment.", "The Fly"], ["Coworkers bring an unexpected guest back from a business trip.", "Alien"], ["A television personality discovers his employer has violated labor laws since his birth.", "The Truman Show"], ["Two men debate memory and employment while one develops an origami problem.", "Blade Runner"], ["A woman meets a wealthy European aristocrat with extremely unusual sleeping habits.", "Bram Stoker's Dracula"], ["A family's winter getaway becomes a prolonged disagreement about manuscript quality.", "The Shining"], ["A man takes a cab ride and learns his passenger has an unusually demanding itinerary.", "Collateral"], ["A group of friends goes spelunking and discovers they did not properly research the local wildlife.", "The Descent"], ["A man tries to solve his insomnia by joining an unconventional support group.", "Fight Club"], ["A musician visits an island where the locals are aggressively enthusiastic about agriculture.", "The Wicker Man"], ["A private investigator takes a water-related case and discovers municipal politics are complicated.", "Chinatown"], ["A man becomes concerned that his new apartment building has unusually intrusive neighbors.", "Rosemary's Baby"], ["A group of teenagers finds an old book and demonstrates why reading aloud is sometimes a bad idea.", "The Evil Dead"], ["A man spends most of his vacation trying to determine whether his memories are real.", "Total Recall"], ["A woman takes a shower and permanently changes cinema history.", "Psycho"], ["A man travels upriver for a performance review that gets badly out of hand.", "Apocalypse Now"], ["A detective receives a series of clues from someone with very strong opinions about morality.", "Se7en"], ["A teenager learns that suburban gardening can hide significant family problems.", "Edward Scissorhands"], ["A group of researchers learns that imitation is not always flattering.", "The Thing"], ["A young woman discovers her boyfriend's family has a very unusual approach to medical ethics.", "Get Out"], ["A man attends a party where the dress code is considerably more important than expected.", "Eyes Wide Shut"], ["A detective investigates a missing person and discovers the locals are very committed to tradition.", "The Wicker Man"], ["A family moves to the suburbs and discovers their neighbors are aggressively festive.", "The 'Burbs"], ["A young man gets an unusual summer job involving a motel and his mother.", "Psycho"], ["A detective has one week to solve a problem that keeps arriving in increasingly unpleasant forms.", "Se7en"], ["A man discovers that his memories may have been provided by customer service.", "Total Recall"], ["A group of adults spends a very long night debating which one of them is actually themselves.", "The Thing"], ["A man investigates a missing woman and develops serious concerns about local agriculture.", "The Wicker Man"]], "bonus": [["THREE OBJECTS: Red stapler • printer • flair-covered uniform", "Office Space"], ["THREE OBJECTS: Leg lamp • BB gun • frozen flagpole", "A Christmas Story"], ["THREE OBJECTS: Proton pack • marshmallows • library card", "Ghostbusters"], ["THREE OBJECTS: Rabbit • shrubbery • coconut halves", "Monty Python and the Holy Grail"], ["THREE OBJECTS: Scissors • hedge clippers • ice sculpture", "Edward Scissorhands"], ["THREE OBJECTS: DeLorean • clock tower • skateboard", "Back to the Future"], ["THREE OBJECTS: Typewriter • axe • Room 237", "The Shining"], ["THREE OBJECTS: Red balloon • paper boat • storm drain", "It"], ["THREE OBJECTS: Fedora • whip • golden idol", "Raiders of the Lost Ark"], ["THREE OBJECTS: Ruby slippers • bicycle • tornado", "The Wizard of Oz"], ["THREE OBJECTS: Pink soap • sunglasses • business card", "Fight Club"], ["THREE OBJECTS: Chess pieces • air vent • flamethrower", "The Thing"], ["THREE OBJECTS: VHS tape • well • telephone", "The Ring"], ["THREE OBJECTS: Hoverboard • sports almanac • clock tower", "Back to the Future Part II"], ["FINAL BOSS: A group spends roughly nine hours walking somewhere because their friend refuses to throw away some jewelry.", "The Lord of the Rings trilogy"]]};
const POINTS={easy:1,medium:2,hard:3,bonus:5}, ORDER=["easy","medium","hard","bonus"];
let game,ri,qi,score;
const $=id=>document.getElementById(id);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickUnique(){
  const used=new Set(), out={};
  for(const r of ORDER){out[r]=[];const count=r==="bonus"?5:10;for(const q of shuffle(BANK[r])){if(!used.has(q[1])||r==="bonus"){out[r].push(q);used.add(q[1])}if(out[r].length===count)break}}
  return out;
}
function buildRounds(){ $("rounds").innerHTML=ORDER.map((r,i)=>`<div class="round" id="tab-${i}">${r[0].toUpperCase()+r.slice(1)}<br><b>${POINTS[r]} pt${POINTS[r]>1?"s":""}</b></div>`).join("")}
function newGame(){game=pickUnique();restart()}
function restart(){ri=0;qi=0;score=0;$("score").textContent=0;$("finish").classList.add("hidden");$("play").classList.remove("hidden");render()}
function render(){const r=ORDER[ri],q=game[r][qi];document.querySelectorAll(".round").forEach((x,i)=>x.classList.toggle("active",i===ri));$("roundLabel").textContent=r.toUpperCase()+" ROUND";$("progress").textContent=`${qi+1} / ${game[r].length}`;$("value").textContent=`Worth ${POINTS[r]} point${POINTS[r]>1?"s":""}`;$("clue").textContent=q[0];$("answer").textContent=q[1];$("answerBox").classList.add("hidden");$("reveal").classList.remove("hidden");$("correct").classList.add("hidden");$("wrong").classList.add("hidden")}
function next(ok){const r=ORDER[ri];if(ok)score+=POINTS[r];$("score").textContent=score;qi++;if(qi>=game[r].length){ri++;qi=0;if(ri>=ORDER.length){$("play").classList.add("hidden");$("finish").classList.remove("hidden");$("final").textContent=`Final score: ${score} / 85`;document.querySelectorAll(".round").forEach(x=>x.classList.remove("active"));return}}render()}
$("reveal").onclick=()=>{$("answerBox").classList.remove("hidden");$("reveal").classList.add("hidden");$("correct").classList.remove("hidden");$("wrong").classList.remove("hidden")};
$("correct").onclick=()=>next(true);$("wrong").onclick=()=>next(false);$("newGame").onclick=newGame;$("restart").onclick=restart;
buildRounds();newGame();
</script>
</body>
</html>
